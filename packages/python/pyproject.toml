[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "veribridge"
version = "0.1.0"
description = "Bidirectional JSON-LD-Ex / CBOR-LD-Ex bridge preserving veracity annotations exactly across encodings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Muntaser Syed" },
]

[tool.setuptools.packages.find]
where = ["src"]
